    rate_gpm: 1.24
    observed: 24
    synthetic: 31
    # Dishwashers draw in several short fills separated by genuine multi-minute
    # gaps. Without a wide bridge one cycle becomes half a dozen events.
    segmentation: {min_duration_s: 20, bridge_gap_s: 420}

