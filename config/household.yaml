# Fixtures present in the home but deliberately excluded from the model.
# The primary bathroom has a bathtub; no use was recorded during the study
# period, so it contributes no training signal and is dropped rather than
# carried as an always-zero output.
excluded_fixtures:
  - code: Ad_B
    label: "Bathtub"
    room: primary_bathroom
    diary: {page: primary_bathroom, symbol: B}
    reason: "No use recorded during the study period."
